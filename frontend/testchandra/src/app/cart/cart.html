<h1>Cart</h1>

<p *ngIf="cartItemsWithQuantity.length === 0">Your cart is empty</p>

<table *ngIf="cartItemsWithQuantity.length > 0" class="cart-table">
  <thead>
    <tr>
      <th></th>
      <th>Product Name</th>
      <th>Price</th>
      <th>Quantity</th>
      <th>Total</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of cartItemsWithQuantity">
      <td><img [src]="item.image" alt="{{item.name}}" width="50"></td>
      <td>{{item.name}}</td>
      <td>${{item.price}}</td>
      <td>{{item.quantity}}</td>
      <td>${{(item.price * item.quantity) | number:'1.2-2'}}</td>
      <td><button (click)="removeItem(item)">Remove</button></td>
    </tr>
  </tbody>
</table>

<div *ngIf="cartItemsWithQuantity.length > 0" class="cart-footer">
  <h2>Total: ${{ cartTotals | number:'1.2-2' }}</h2>
  <button (click)="checkout()" class="checkout-btn">Checkout</button>
</div>
