       <h2>Our Products</h2>
 <div class="product-grid">
@for (product of products; track product._id) {
    <div (click)="single_product(product)" class="product-card">
<img [src]="product.image" alt="{{product.name}}" />
<h3>{{product.name}}</h3>
<p class="desc">{{product.description}}</p>
<p class="price">${{product.price}}</p>
<!-- <button (click)="addtocart(product)">Add to Cart</button> -->
<p-button (click)="addtocart(product)" label="Add to Cart" />
</div>
}
</div>

<div class="card">
<p-carousel [value]="products" [numVisible]="3" [numScroll]="1" [circular]="true" [responsiveOptions]="responsiveOptions" autoplayInterval="3000">
    <ng-template let-product #item>
        <div class="border border-surface-200 dark:border-surface-700 rounded m-2 p-4">
            <div class="mb-4">
                <div class="relative mx-auto">
                    <img [src]="product.image" alt="{{product.name}}" class="w-full rounded-border" />
                    <!-- <p-tag [value]="product.inventoryStatus" [severity]="getSeverity(product.inventoryStatus)" class="absolute dark:!bg-surface-900" [ngStyle]="{ 'left.px': 5, 'top.px': 5 }" /> -->
                </div>
            </div>
            <div class="mb-4 font-medium">{{ product.name }}</div>
            <div class="flex justify-between items-center">
                <div class="mt-0 font-semibold text-xl">{{ '$' + product.price }}</div>
                <span>
                    <!-- <p-button icon="pi pi-heart" severity="secondary" [outlined]="true" /> -->
                    <p-button icon="pi pi-shopping-cart" styleClass="ml-2" (click)="addtocart(product)"  label="add to cart"/>
                </span>
            </div>
        </div>
    </ng-template>
</p-carousel>
</div>
